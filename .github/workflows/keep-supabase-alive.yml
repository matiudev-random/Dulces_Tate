name: Keep Supabase alive

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Esta acción hace una consulta liviana cada 3 días para que nunca se cumpla
# ese plazo, sin depender de que la app se use seguido.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/productos?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
